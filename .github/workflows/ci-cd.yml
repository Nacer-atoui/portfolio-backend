name: CI/CD Backend

on:
  push:
    branches:
      - main
      - dev
      - feat/*
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio_test
          JWT_SECRET=un_secret_tres_long_et_aleatoire_a_remplacer
          MAILJET_API_KEY=aaaaaaaaaaaaaaaaaaaaa
          MAILJET_SECRET_KEY=aaaaaaaaaaaaaaaaaaaaaaaa
          MAILJET_SENDER_EMAIL=n@n.fr
          MAIL_USER=n@n.fr
          MAIL_PASS=aaaaaaaaaaaaaaa
          MAIL_TO=n@n.fr
          CLOUDINARY_URL=cloudinary://288475237564248:P-CXSEFJ2ftlauqkiA0Fx4JFZSc@kddk
          CLOUDINARY_CLOUD_NAME=dilqub3
          CLOUDINARY_API_KEY=eaaaaaaaaaaaa
          CLOUDINARY_API_SECRET=P-aaaaaaaaa
          CORS_ORIGIN=aaaaaaaaaaaaa        
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🗄️ Initialiser le schéma de test
        run: mysql -h 127.0.0.1 -u root -proot portfolio_test < db/init.sql

      - name: 🧪 Lancer les tests
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: portfolio_test
          DB_USER: root
          DB_PASSWORD: root
          PORT: 3000
          JWT_SECRET: test_secret_key
          CORS_ORIGIN: http://localhost:5173